server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # SPA fallback
    location / {
        try_files $uri /index.html;
    }

    # Static assets: long cache
    location /assets/ {
        expires 30d;
        add_header Cache-Control "public, immutable";
    }

    # API reverse proxy (same-origin so no CORS needed in production).
    # proxy_buffering off is required for the SSE chat/stream endpoint.
    location /api/ {
        proxy_pass http://api:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_buffering off;
        proxy_cache off;
        # 150s: headroom above the crawl endpoint's 120s wall-clock budget
        # (app/core/config.py's crawl_time_budget_seconds) — applied to the
        # whole /api/ block since it's the only endpoint needing >15-30s and
        # a path-scoped location block would add nginx config surface for
        # one route with no other benefit.
        proxy_read_timeout 150s;
        proxy_send_timeout 150s;
    }

    # Public widget script served by the API.
    location /widget.js {
        proxy_pass http://api:8000/widget.js;
        proxy_set_header Host $host;
        proxy_buffering off;
    }
}