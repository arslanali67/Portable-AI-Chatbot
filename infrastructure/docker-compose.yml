services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: portableai-postgres
    environment:
      POSTGRES_DB: portableai
      POSTGRES_USER: portableai
      POSTGRES_PASSWORD: portableai
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U portableai -d portableai"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: portableai-redis
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
